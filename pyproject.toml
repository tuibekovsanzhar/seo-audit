[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maya-audit"
version = "0.2.8"
description = "Reference implementation of the Maya technical audit checklist (docs/technical-audit-checklist.md)."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
# Lower bounds are the first releases with no known advisory (pip-audit, 2026-10-21; docs/review-fixes/w5-llm.md).
# No FastAPI release requires a patched Starlette, so Starlette is named directly. FastAPI 0.133 dropped the
# `starlette<1.0` cap; 0.135 is the first to require `starlette>=0.46` and is the lowest pair tested (with 1.3.1).
dev = ["pytest>=9.0.3", "cryptography>=50", "playwright>=1.45,<1.64", "fastapi>=0.135", "starlette>=1.3.1",
       "uvicorn>=0.29", "pypdf>=6.19"]
# T1 rendering for RND checks; also run `playwright install chromium` once.
render = ["playwright>=1.45,<1.64"]
# The local web app: python -m maya_audit_web
web = ["fastapi>=0.135", "starlette>=1.3.1", "uvicorn>=0.29", "pypdf>=6.19"]
# Everything a colleague needs to use the web app, without the test tools (TEAM-SETUP.md).
team = ["fastapi>=0.135", "starlette>=1.3.1", "uvicorn>=0.29", "playwright>=1.45,<1.64", "pypdf>=6.19"]

[project.scripts]
maya-audit = "maya_audit.cli:main"

[tool.setuptools.packages.find]
include = ["maya_audit*"]

[tool.setuptools.package-data]
"maya_audit.client_reporting" = ["references/*", "assets/*"]
maya_audit_web = ["static/*", "locales/*.json", "locales/catalog/*.json", "locales/findings/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
